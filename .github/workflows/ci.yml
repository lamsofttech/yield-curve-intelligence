name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      # Informational, not blocking: known transitive-dependency findings
      # (pillow/starlette via gradio) are deferred to Dependabot rather
      # than a risky major-version bump under time pressure -- see
      # DECISIONS.md. A failing pip-audit here should not fail CI while
      # that's true, but the output stays visible in the log.
      - run: pip-audit -r requirements.txt
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yield-curve-intelligence:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
